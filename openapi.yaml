openapi: 3.0.3
info:
  title: homelabd API
  version: 1.0.0
  description: Lightweight API-first control plane for Linux servers and homelabs.
servers:
  - url: /api/v1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
paths:
  /auth/setup:
    post:
      summary: Bootstrap the initial admin account
      description: Creates the first admin user. Only accessible when no users exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Setup complete, returns session token
  /auth/login:
    post:
      summary: Login to generate a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Returns session token
  /auth/tokens:
    post:
      summary: Create a programmatic API token
      description: Generates a new API token. Requires an active admin token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                user_id:
                  type: string
      responses:
        '201':
          description: Token created successfully
  /system:
    get:
      summary: Get system information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
  /docker/containers:
    get:
      summary: List containers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
  /docker/stacks:
    get:
      summary: List Compose stacks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
  /system/reboot:
    post:
      summary: Reboot host
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
      responses:
        '200':
          description: Reboot scheduled
  /events:
    get:
      summary: Stream Server-Sent Events
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
